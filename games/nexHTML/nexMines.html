<!doctype html><html><body style="margin:0;background:linear-gradient(135deg,#19151f,#30213c);color:white;font:15px system-ui;text-align:center"><h1>💣 nexMines</h1><p>avoid the hidden mines</p><div id="g" style="display:grid;grid-template-columns:repeat(5,48px);gap:5px;justify-content:center"></div><p id="m"></p><script>let mines=new Set();for(let i=0;i<5;i++)mines.add(Math.random()*25|0);for(let i=0;i<25;i++){let b=document.createElement('button');b.style='height:48px;border:0;border-radius:9px;background:#ffffff18;color:white';b.onclick=()=>{if(mines.has(i)){b.textContent='💥';m.textContent='boom 😭'}else{b.textContent='✓';b.style.background='#91b9ff33'}};g.appendChild(b)}</script></body></html>
