<!doctype html><html><body style="margin:0;background:linear-gradient(135deg,#151827,#34245d);color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh"><main style="text-align:center"><h1>🔢 nex2048</h1><p>tiny 2048-style game</p><div id="b" style="display:grid;grid-template-columns:repeat(4,70px);gap:7px"></div><button id="n" style="margin:15px;padding:10px;border:0;border-radius:10px">New game</button></main><script>let a=[];function start(){a=Array(16).fill(0);add();add();draw()}function add(){let z=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=2}function draw(){b.innerHTML='';a.forEach((v,i)=>{let x=document.createElement('button');x.textContent=v||'';x.style.cssText='height:70px;border:0;border-radius:12px;font-size:22px;background:'+(v?'#91b9ff':'#ffffff18');x.onclick=()=>{if(!v)return;a[i]=v*2;add();draw()};b.appendChild(x)})}n.onclick=start;start()</script></body></html>
