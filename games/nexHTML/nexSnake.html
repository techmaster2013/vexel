<!doctype html><html><body style="margin:0;background:#09110d;color:#d8ffe4;font:16px system-ui;text-align:center"><h1>🐍 nexSnake</h1><canvas id="c" width="320" height="320" style="max-width:90%;background:#101b14;border-radius:15px"></canvas><p>use arrow keys</p><script>const c=document.getElementById('c'),x=c.getContext('2d');let s=[[8,8]],d=[1,0],f=[12,12];onkeydown=e=>{let q={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(q&&!(q[0]==-d[0]&&q[1]==-d[1]))d=q};setInterval(()=>{let h=[s[0][0]+d[0],s[0][1]+d[1]];if(h[0]<0||h[1]<0||h[0]>=16||h[1]>=16||s.some(p=>p[0]==h[0]&&p[1]==h[1]))s=[[8,8]],d=[1,0];else{s.unshift(h);if(h[0]==f[0]&&h[1]==f[1])f=[Math.random()*16|0,Math.random()*16|0];else s.pop()}x.clearRect(0,0,320,320);x.fillStyle='#91b9ff';s.forEach(p=>x.fillRect(p[0]*20+2,p[1]*20+2,16,16));x.fillStyle='#ff7f88';x.fillRect(f[0]*20+3,f[1]*20+3,14,14)},130)</script></body></html>
