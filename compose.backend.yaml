# Optional HTTPS backend for Pages Discord sign-in and Caver/Wisp.
services:
  vexel:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      GAME_CONTENT_DIR: /games
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - vexel-data:/app/data
      - ../vex-games:/games:ro
      - ./secrets:/run/secrets:ro
    expose: ["3000"]
    restart: unless-stopped
    init: true
  caddy:
    image: caddy:2
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [vexel]
    restart: unless-stopped
volumes:
  vexel-data:
  caddy-data:
  caddy-config:
