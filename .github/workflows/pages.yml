name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the game catalog
        run: node scripts/validate-games.mjs
      - name: Add the Debian desktop image, if it has been built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download vm-debian --repo "$GITHUB_REPOSITORY" -p 'vexel-debian-lxde-i386.iso*' -D "$RUNNER_TEMP/debian"; then
            (cd "$RUNNER_TEMP/debian" && sha256sum -c vexel-debian-lxde-i386.iso.sha256)
            python3 scripts/split-vm-image.py "$RUNNER_TEMP/debian/vexel-debian-lxde-i386.iso" public/vendor/v86/debian --name debian
          else
            echo "No Debian image yet; run the 'Build Debian VM image' workflow to add it."
          fi
      - name: Prepare static files
        run: python3 scripts/prepare-pages.py --output "$RUNNER_TEMP/pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
